<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cancioneiro do Coro</title>
<meta name="description" content="Repositório de músicas do coro — letras, acordes e partitura.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">

  <div id="listView" class="app-screen">
    <header class="topbar">
      <h1 class="brand">Cancioneiro</h1>
      <p class="brand-sub">Repositório de cânticos do coro</p>
    </header>

    <div class="controls">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="16.3" y1="16.3" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="search" type="search" placeholder="Procurar por título…" autocomplete="off" aria-label="Procurar por título">
      </div>

      <nav id="tabs" class="tabs" aria-label="Categorias"></nav>
    </div>

    <main id="list" class="list" aria-live="polite"></main>

    <p id="emptyState" class="empty-state hidden">Nenhuma música encontrada.</p>
  </div>

  <div id="detailView" class="detail-screen" aria-hidden="true">
    <header class="detail-header">
      <button id="backBtn" class="back-btn" aria-label="Voltar à lista">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="detail-titles">
        <h2 id="detailTitle"></h2>
        <div class="detail-meta">
          <span id="detailAuthor"></span>
          <span id="detailCategory" class="cat-pill"></span>
        </div>
      </div>
    </header>

    <nav class="view-tabs" aria-label="Modo de visualização">
      <button class="view-tab active" data-view="lyrics">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.5 10h7M8.5 13.5h7M8.5 17h4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Letra
      </button>
      <button class="view-tab" data-view="chords">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="7" cy="17" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="15" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9.4 16.2V5.5L18.4 4v10.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Acordes
      </button>
      <button class="view-tab" data-view="piano">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7.5 5v8.5M11.5 5v8.5M15.5 5v8.5" stroke="currentColor" stroke-width="1.6"/></svg>
        Piano
      </button>
    </nav>

    <div id="detailContent" class="detail-content"></div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.6.4/abcjs-basic-min.js"></script>
<script src="app.js"></script>
</body>
</html>
