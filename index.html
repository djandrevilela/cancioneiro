<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cancioneiro do Coro</title>
<meta name="description" content="Repositório de músicas do coro — letras, acordes e notas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="listView" class="screen">
  <header class="topbar">
    <h1 class="brand">Cancioneiro</h1>
    <p class="brand-sub">Repositório de cânticos do coro</p>
  </header>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
      <line x1="16.3" y1="16.3" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <input id="search" type="search" placeholder="Procurar por título…" autocomplete="off" aria-label="Procurar por título">
  </div>

  <nav id="tabs" class="tabs" aria-label="Categorias"></nav>

  <main id="list" class="list" aria-live="polite"></main>

  <p id="emptyState" class="empty-state hidden">Nenhuma música encontrada.</p>
</div>

<div id="detailView" class="screen detail hidden">
  <header class="detail-header">
    <button id="backBtn" class="back-btn" aria-label="Voltar à lista">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="detail-titles">
      <h2 id="detailTitle"></h2>
      <p id="detailAuthor"></p>
    </div>
  </header>

  <nav class="view-tabs" aria-label="Modo de visualização">
    <button class="view-tab active" data-view="lyrics">Letra</button>
    <button class="view-tab" data-view="chords">Acordes</button>
    <button class="view-tab" data-view="piano">Piano</button>
  </nav>

  <div id="detailContent" class="detail-content"></div>
</div>

<script src="app.js"></script>
</body>
</html>
